{% extends "base.html" %}
{% block title %}Login — AgriSense AI{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Login</h1>
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="auth-switch">No account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
