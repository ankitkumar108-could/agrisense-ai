{% extends "base.html" %}

{% block title %}Admin Lock — AgriSense AI{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>🔒 Admin Access</h1>
  <form method="post">
    <div class="form-group">
      <label for="passcode">Passcode</label>
      <input
        id="passcode"
        type="password"
        name="passcode"
        required
        autofocus
        placeholder="Enter admin passcode"
      >
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Unlock</button>
  </form>
</div>
{% endblock %}
